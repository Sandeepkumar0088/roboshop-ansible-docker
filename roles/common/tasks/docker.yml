- name: add repo file
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/rhel/docker-ce.repo
    dest: /etc/yum.repos.d/docker.repo
- name: install docker
  ansible.builtin.dnf:
    name: docker-ce
    state: installed
- name: start docker
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started
- name: install python requests
  ansible.builtin.shell: pip3.13 install requests
- name: last parttion
  ansible.builtin.shell: growpart /dev/nvme0n1 4
- name: extend var volume
  community.general.lvol:
    vg: RootVG
    lv: var-Vol
    size: 100%FREE
    resizefs: true